<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sip or Boom</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .status {
      margin-top: 6px;
      font-size: 1.05rem;
      color: #94a3b8;
      font-weight: 600;
      min-height: 1.5em;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 16px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .control-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .option-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .option-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }

    .grid-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      gap: 10px;
      width: 100%;
      height: 100%;
    }
    .cell {
      background: linear-gradient(145deg, #1e293b, #334155);
      border-radius: 10px;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      outline: none;
    }
    .cell:active:not(.revealed) {
      transform: scale(0.95);
    }
    .cell.safe {
      background: #10b981;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
      cursor: default;
    }
    .cell.bomb {
      background: #ef4444;
      border-color: #f87171;
      box-shadow: 0 0 25px #ef4444;
      cursor: default;
    }

    .footer {
      margin-top: 18px;
      width: 100%;
      max-width: 360px;
    }
    .btn-reset {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
      outline: none;
    }
    .btn-reset:active {
      opacity: 0.85;
    }

    .shake {
      animation: screen-shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
